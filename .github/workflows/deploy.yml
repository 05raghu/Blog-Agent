
name: Blog-Agent Docker Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-agent-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t blog-agent:${{ github.sha }} \
            -t blog-agent:latest \
            .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Save Docker image
        run: |
          docker save blog-agent:${{ github.sha }} |
            gzip > blog-agent.tar.gz

      - name: Transfer image to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            blog-agent.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/blog-agent.tar.gz"

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -eu

          docker load -i /tmp/blog-agent.tar.gz
          mkdir -p /opt/blog-agent

          if [ ! -f /opt/blog-agent/.env ]; then
            echo 'Missing /opt/blog-agent/.env'
            exit 1
          fi

          docker rm -f blog-agent-web 2>/dev/null || true

          docker run -d \
            --name blog-agent-web \
            --restart unless-stopped \
            --env-file /opt/blog-agent/.env \
            -p 127.0.0.1:3000:3000 \
            "blog-agent:${IMAGE_TAG}"

          rm -f /tmp/blog-agent.tar.gz
          docker ps --filter name=blog-agent-web
          REMOTE
