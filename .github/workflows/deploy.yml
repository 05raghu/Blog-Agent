
name: Blog-Agent Docker Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-agent-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t blog-agent:${{ github.sha }} \
            .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Save Docker image
        run: |
          docker save blog-agent:${{ github.sha }} |
            gzip > blog-agent.tar.gz

      - name: Transfer image to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            blog-agent.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/blog-agent.tar.gz"

      - name: Deploy and verify on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          ARCHIVE=/tmp/blog-agent.tar.gz
          NEW_IMAGE="blog-agent:${IMAGE_TAG}"
          CANDIDATE=blog-agent-web-candidate
          WEB_STARTED=0
          WORKER_STARTED=0

          cleanup() {
            docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
            rm -f "$ARCHIVE"
          }
          trap cleanup EXIT

          if [ ! -f /opt/blog-agent/.env ]; then
            echo "Missing /opt/blog-agent/.env"
            exit 1
          fi

          docker load -i "$ARCHIVE"

          # Capture currently running versions for rollback.
          OLD_WEB_IMAGE=$(docker inspect \
            --format '{{.Config.Image}}' blog-agent-web)
          OLD_WORKER_IMAGE=$(docker inspect \
            --format '{{.Config.Image}}' blog-agent-worker)

          docker tag "$OLD_WEB_IMAGE" blog-agent:rollback-web
          docker tag "$OLD_WORKER_IMAGE" blog-agent:rollback-worker

          # Test the new web image on a temporary local port.
          docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true

          docker run -d \
            --name "$CANDIDATE" \
            --env-file /opt/blog-agent/.env \
            -p 127.0.0.1:13000:3000 \
            "$NEW_IMAGE"

          WEB_OK=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13000/ \
                -o /dev/null; then
              WEB_OK=1
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' "$CANDIDATE")" != "true" ]; then
              break
            fi

            sleep 2
          done

          if [ "$WEB_OK" -ne 1 ]; then
            docker logs --tail 100 "$CANDIDATE" || true
            echo "New web image failed its health check."
            exit 1
          fi

          # Switch the web container to the verified image.
          docker rm -f blog-agent-web

          if docker run -d \
              --name blog-agent-web \
              --restart unless-stopped \
              --env-file /opt/blog-agent/.env \
              -p 127.0.0.1:3000:3000 \
              "$NEW_IMAGE"; then
            WEB_STARTED=1
          else
            echo "New web container failed to start."
          fi

          # Verify the live web port.
          WEB_OK=0
          if [ "$WEB_STARTED" -eq 1 ]; then
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3000/ \
                  -o /dev/null; then
                WEB_OK=1
                break
              fi
              sleep 2
            done
          fi

          if [ "$WEB_OK" -ne 1 ]; then
            docker rm -f blog-agent-web >/dev/null 2>&1 || true
            docker run -d \
              --name blog-agent-web \
              --restart unless-stopped \
              --env-file /opt/blog-agent/.env \
              -p 127.0.0.1:3000:3000 \
              blog-agent:rollback-web
            echo "Web deployment failed; previous version restored."
            exit 1
          fi

          # Recreate worker using the same newly built image.
          docker rm -f blog-agent-worker

          if docker run -d \
              --name blog-agent-worker \
              --restart unless-stopped \
              --env-file /opt/blog-agent/.env \
              "$NEW_IMAGE" \
              pnpm --filter @blog-agent/worker start; then
            WORKER_STARTED=1
          fi

          sleep 5

          WORKER_OK=0
          if [ "$WORKER_STARTED" -eq 1 ] &&
             [ "$(docker inspect -f '{{.State.Running}}' blog-agent-worker)" = "true" ]; then
            WORKER_OK=1
          fi

          if [ "$WORKER_OK" -ne 1 ]; then
            docker logs --tail 100 blog-agent-worker || true
            docker rm -f blog-agent-worker >/dev/null 2>&1 || true
            docker run -d \
              --name blog-agent-worker \
              --restart unless-stopped \
              --env-file /opt/blog-agent/.env \
              blog-agent:rollback-worker \
              pnpm --filter @blog-agent/worker start

            echo "Worker deployment failed; previous worker restored."
            exit 1
          fi

          # Update latest only after both services start successfully.
          docker tag "$NEW_IMAGE" blog-agent:latest

          # Remove obsolete commit tags while preserving one rollback
          # version for each service.
          docker images --format '{{.Repository}}:{{.Tag}}' |
          while IFS= read -r image; do
            case "$image" in
              "blog-agent:${IMAGE_TAG}"|\
              "blog-agent:latest"|\
              "blog-agent:rollback-web"|\
              "blog-agent:rollback-worker")
                ;;
              blog-agent:*)
                docker image rm "$image" || true
                ;;
            esac
          done

          echo "Deployment completed successfully."
          docker ps --filter name=blog-agent-web
          docker ps --filter name=blog-agent-worker
          docker system df
          df -h /
          REMOTE
